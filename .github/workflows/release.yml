# Push a tag like v0.2.0 → builds mac/windows/linux installers and publishes a GitHub release.
# Stable asset names (RefRef-mac.dmg etc.) keep the website's /releases/latest/download/ links working.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # ponytail: unsigned builds; add CSC_LINK/APPLE_ID secrets for signing + notarization when ready.
      - run: npx electron-builder --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - run: gh release create "$GITHUB_REF_NAME" RefRef-* --repo "$GITHUB_REPOSITORY" --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }
